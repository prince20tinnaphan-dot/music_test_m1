<!DOCTYPE html>

<meta charset="UTF-8">

<title>แบบทดสอบดนตรีสากล ม.1</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:linear-gradient(135deg,#dff3ff,#f8e8ff);
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
  padding:18px;
}

header{
  background:linear-gradient(135deg,#5146e5,#8e44ad);
  color:white;
  padding:25px 18px;
  border-radius:22px;
  text-align:center;
  box-shadow:0 8px 25px #0002;
  margin-bottom:20px;
}

header h1{
  margin:0 0 8px;
  font-size:28px;
}

header p{
  margin:0;
  font-size:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 5px 18px #0002;
}

.question{
  font-size:19px;
  font-weight:bold;
  line-height:1.6;
  margin-bottom:15px;
}

.options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.option{
  display:flex;
  align-items:center;
  gap:10px;
  border:2px solid #ddd;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  transition:.2s;
  background:#fff;
}

.option:hover{
  background:#f4f2ff;
  border-color:#7167e8;
}

.option input{
  width:19px;
  height:19px;
  flex:none;
}

.label{
  font-weight:bold;
  width:25px;
  flex:none;
}

.staff{
  width:100%;
  max-width:500px;
  margin:15px auto;
  display:block;
  background:#fafafa;
  border-radius:12px;
  border:1px solid #ddd;
}

button{
  border:none;
  border-radius:14px;
  padding:15px 25px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

#submitBtn{
  width:100%;
  background:#5146e5;
  color:white;
  margin:10px 0 20px;
}

#submitBtn:hover{
  background:#4035c5;
}

#restartBtn{
  background:#18a66b;
  color:white;
  width:100%;
}

.result{
  display:none;
  background:white;
  border-radius:20px;
  padding:25px;
  margin-bottom:20px;
  text-align:center;
  box-shadow:0 5px 20px #0002;
}

.score{
  font-size:38px;
  font-weight:bold;
  color:#5146e5;
}

.explanation{
  margin-top:10px;
  padding:14px;
  border-radius:12px;
  text-align:left;
  line-height:1.6;
}

.correct{
  background:#e8f8ee;
  border-left:5px solid #20a463;
}

.wrong{
  background:#ffeded;
  border-left:5px solid #e34b4b;
}

@media(max-width:600px){
  header h1{
    font-size:23px;
  }

  .question{
    font-size:17px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🎵 แบบทดสอบดนตรีสากล ม.1</h1>
  <p>50 ข้อ • ตัวเลือกสุ่มทุกครั้ง • พร้อมเฉลยและคำอธิบาย</p>
</header>

<div id="quiz"></div>

<button id="submitBtn" onclick="submitQuiz()">📤 ส่งคำตอบ</button>

<div id="result" class="result">
  <h2>🎉 ผลการทดสอบ</h2>
  <div class="score" id="score"></div>
  <p id="scoreText"></p>
  <button id="restartBtn" onclick="restartQuiz()">🔄 ทำใหม่</button>

function staffSVG(clef, notePosition=null){

  let clefSymbol = clef === "treble" ? "𝄞" : "𝄢";

  let noteY = {
    "line1":145,
    "space1":132,
    "line2":119,
    "space2":106,
    "line3":93,
    "space3":80,
    "line4":67,
    "space4":54,
    "line5":41
  };

  let note = "";

  if(notePosition){
    let y = noteY[notePosition] || 93;

    note = `
      <ellipse cx="270" cy="${y}" rx="10" ry="7"
               fill="black"
               transform="rotate(-15 270 ${y})"/>
      <line x1="278" y1="${y}" x2="278" y2="${y-38}"
            stroke="black" stroke-width="3"/>
    `;
  }

  return `
  <svg class="staff" viewBox="0 0 520 180">

    <rect x="0" y="0" width="520" height="180"
          rx="12" fill="#fff"/>

    <text x="20" y="115"
          font-size="82"
          font-family="serif">${clefSymbol}</text>

    <line x1="85" y1="41" x2="490" y2="41"
          stroke="black" stroke-width="2"/>
    <line x1="85" y1="67" x2="490" y2="67"
          stroke="black" stroke-width="2"/>
    <line x1="85" y1="93" x2="490" y2="93"
          stroke="black" stroke-width="2"/>
    <line x1="85" y1="119" x2="490" y2="119"
          stroke="black" stroke-width="2"/>
    <line x1="85" y1="145" x2="490" y2="145"
          stroke="black" stroke-width="2"/>

    ${note}

  </svg>
  `;
}

/* =========================
   สุ่มตัวเลือก
========================= */

function shuffle(array){
  let arr=[...array];

  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }

  return arr;
}


/* =========================
   แสดงข้อสอบ
========================= */

function renderQuiz(){

  const quiz=document.getElementById("quiz");

  quiz.innerHTML="";

  questions.forEach((question,index)=>{

    let shuffledOptions=shuffle(question.o);

    let card=document.createElement("div");
    card.className="card";

    let html=`
      <div class="question">
        ข้อที่ ${index+1}. ${question.q}
      </div>
    `;

    if(question.img){
      html+=question.img;
    }

    html+=`<div class="options">`;

    const labels=["ก","ข","ค","ง"];

    shuffledOptions.forEach((option,i)=>{

      html+=`
        <label class="option">

          <input
            type="radio"
            name="q${index}"
            value="${escapeHTML(option)}"
          >

          <span class="label">${labels[i]}.</span>

          <span>${escapeHTML(option)}</span>

        </label>
      `;
    });

    html+=`</div>`;

    card.innerHTML=html;

    quiz.appendChild(card);

  });

}


/* ป้องกัน HTML ในตัวเลือก */

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   ตรวจคำตอบ
========================= */

function submitQuiz(){

  let score=0;

  questions.forEach((question,index)=>{

    const selected=document.querySelector(
      `input[name="q${index}"]:checked`
    );

    if(selected){

      if(selected.value===question.a){
        score++;
      }

    }

  });


  document.getElementById("result").style.display="block";

  document.getElementById("score").textContent=
    `${score} / ${questions.length} คะแนน`;

  let percent=Math.round(
    score/questions.length*100
  );

  document.getElementById("scoreText").textContent=
    `ได้ ${percent}%`;

  showExplanations();

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


/* =========================
   แสดงเฉลย
========================= */

function showExplanations(){

  questions.forEach((question,index)=>{

    const card=document.querySelectorAll(".card")[index];

    const selected=document.querySelector(
      `input[name="q${index}"]:checked`
    );

    let old=card.querySelector(".explanation");

    if(old) old.remove();

    let div=document.createElement("div");

    div.className="explanation";

    if(selected && selected.value===question.a){

      div.classList.add("correct");

      div.innerHTML=`
        <strong>✅ ถูกต้อง!</strong><br>
        คุณเลือก: ${selected.value}<br>
        คำตอบที่ถูก: ${question.a}<br><br>
        <strong>เหตุผล:</strong> ${question.e}
      `;

    }else{

      div.classList.add("wrong");

      let selectedText=
        selected ? selected.value : "ไม่ได้เลือกคำตอบ";

      div.innerHTML=`
        <strong>❌ ยังไม่ถูก</strong><br>
        คุณเลือก: ${selectedText}<br>
        คำตอบที่ถูก: ${question.a}<br><br>
        <strong>เหตุผล:</strong> ${question.e}
      `;

    }

    card.appendChild(div);

  });

}


/* =========================
   ทำใหม่
========================= */

function restartQuiz(){

  document.getElementById("result").style.display="none";

  renderQuiz();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* เริ่มเกมครั้งแรก */

renderQuiz();

</script>
