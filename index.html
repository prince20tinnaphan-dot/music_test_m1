/* =====================================================
   เครื่องมือสร้างรูปบรรทัด 5 เส้น
===================================================== */

function staff(type="treble", note=null, position=null){

    let clef = type==="treble" ? "𝄞" : "𝄢";

    let lines="";

    for(let i=0;i<5;i++){
        let y=45+i*15;
        lines += `<line x1="145" y1="${y}" x2="650" y2="${y}"
        stroke="black" stroke-width="2"/>`;
    }

    let noteSVG="";

    if(note && position){

        /*
        position:
        line1 = เส้นล่างสุด
        line2
        line3
        line4
        line5 = เส้นบนสุด

        space1 = ช่องล่างสุด
        ...
        */

        const positions={
            line1:105,
            space1:97.5,
            line2:90,
            space2:82.5,
            line3:75,
            space3:67.5,
            line4:60,
            space4:52.5,
            line5:45
        };

        let y=positions[position];

        noteSVG=`
        <ellipse cx="360" cy="${y}" rx="11" ry="7"
        fill="black"
        transform="rotate(-15 360 ${y})"/>

        <line x1="369" y1="${y-2}"
        x2="369" y2="${y-42}"
        stroke="black"
        stroke-width="3"/>
        `;
    }

    return `
    <div class="staff-box">

    <div class="staff-title">
    ${type==="treble" ? "🎼 กุญแจซอล" : "🎼 กุญแจฟา"}
    </div>

    <svg class="staff" viewBox="0 0 700 150">

        ${lines}

        <text x="70" y="108"
        font-size="82"
        font-family="serif">
        ${clef}
        </text>

        ${noteSVG}

    </svg>

    </div>
    `;
}

/* =====================================================
   สุ่มเฉพาะเนื้อหาของ ก ข ค ง
   แต่ตัวอักษร ก ข ค ง อยู่ตำแหน่งเดิม
===================================================== */

function shuffleOptions(question){

    let correctText=question.o[
        ["ก","ข","ค","ง"].indexOf(question.a)
    ];

    let shuffled=[...question.o];

    for(let i=shuffled.length-1;i>0;i--){

        let j=Math.floor(Math.random()*(i+1));

        [shuffled[i],shuffled[j]]
        =[shuffled[j],shuffled[i]];
    }

    /*
      ห้ามให้คำตอบถูกกลับไปอยู่ตำแหน่งเดิมทุกครั้ง
      แต่ไม่จำเป็นต้องบังคับ เพราะการสุ่มจริงสามารถซ้ำได้
    */

    return shuffled;
}


/* =====================================================
   สร้างข้อสอบ
===================================================== */

function buildQuiz(){

    const quiz=document.getElementById("quiz");

    quiz.innerHTML="";

    questions.forEach((q,index)=>{

        let number=index+1;

        let shuffled=shuffleOptions(q);

        let html=`
        <div class="question">

        <h3>${number}. ${q.q}</h3>

        ${q.picture || ""}

        `;

        let letters=["ก","ข","ค","ง"];

        shuffled.forEach((text,i)=>{

            html+=`
            <label class="option">

            <input
            type="radio"
            name="q${number}"
            value="${letters[i]}"
            data-text="${text}"
            >

            <b>${letters[i]}.</b> ${text}

            </label>
            `;

        });

        html+=`</div>`;

        quiz.innerHTML+=html;

    });

}


function getCorrectText(q){

    const letters=["ก","ข","ค","ง"];

    let correctIndex=letters.indexOf(q.a);

    /*
      q.o เป็นข้อมูลตัวเลือกดั้งเดิม
      ต้องเก็บข้อความคำตอบเดิมเอาไว้
    */

    return q.o[correctIndex];

}
